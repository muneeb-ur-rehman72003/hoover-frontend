<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap CSS -->
    <link href="css/animate.css" rel="stylesheet" />
    <link href="fontawesome5/css/all.min.css" rel="stylesheet" />
    <link href="slick/slick-theme.css" rel="stylesheet" type="text/css" />

    <link href="css/slicknav.css" rel="stylesheet" type="text/css" />

    <title>Gallery | Hoover Remover Pros</title>
</head>

<body id="top">
    <!-- Header Starts -->
    <div id="Header"></div>
    <!-- Header Ends -->

    <!-- Banner Starts -->

     <section class="main_slider inner-banner">
        <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">


            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="images/banner.jpg" class="img-fluid main-banner-img" alt="..." />
                    <div class="carousel-caption">
                        <div class="container">
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
                                    <div class="banner_text inner-banner-text wow fadeInLeft" data-wow-duration="2s">
                                        <h1>
                                            Gallery
                                        </h1>


                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </div>
        <div class="container">
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="banner-bottom-img-main">
                        <div class="banner-bottom-img">
                            <img src="images/inner-banner-btm-img.png" alt="img" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Banner Ends -->


    <section class="gallery_sec">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-3 wow fadeInLeft">
                    <div class="glry_main">
                        <a href="images/g-1.jpg" data-fancybox="gallery">

                        </a>
                    </div>
                </div>
                <div class="col-lg-3 wow fadeInRight">
                    <div class="glry_main">
                        <a href="images/g-2.jpg" data-fancybox="gallery">

                        </a>
                    </div>
                </div>
                <div class="col-lg-6 wow fadeInRight">
                    <div class="glry_main">
                        <a href="images/g-3.jpg" data-fancybox="gallery">
                            <img src="images/g-3.jpg" alt="img" />
                        </a>
                    </div>
                </div>


                <div class="col-lg-6 wow fadeInLeft">
                    <div class="glry_main">
                        <a href="images/g-4.jpg" data-fancybox="gallery">

                        </a>

                <div class="col-lg-3 wow fadeInRight">

                    </div>
                </div>


                <div class="col-lg-3 wow fadeInLeft">
                    <div class="glry_main">
                        <a href="images/g-7.jpg" data-fancybox="gallery">

                        </a>
                    </div>
                </div>
                <div class="col-lg-3 wow fadeInRight">
                    <div class="glry_main">
                        <a href="images/g-8.jpg" data-fancybox="gallery">
